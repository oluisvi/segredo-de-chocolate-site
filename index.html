<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7eddf">
  <meta name="description" content="Conheça o catálogo da Segredo de Chocolate: docinhos, salgados, tortas e bolos por quilo. Encomende pelo WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Segredo de Chocolate — Doces momentos">
  <meta property="og:description" content="Docinhos, salgados, tortas e bolos feitos com carinho. Consulte e encomende pelo WhatsApp.">
  <meta property="og:image" content="https://oluisvi.github.io/segredo-de-chocolate-site/assets/doces-da-casa.png">
  <meta property="og:locale" content="pt_BR">
  <link rel="canonical" href="https://oluisvi.github.io/segredo-de-chocolate-site/">
  <title>Segredo de Chocolate — Doces momentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-design="editorial">
  <a class="skip-link" href="#site-content">Pular para o conteúdo</a>
  <header class="prototype-toolbar">
    <div class="toolbar-copy">
      <span class="toolbar-mark" aria-hidden="true">SC</span>
      <div><p class="toolbar-kicker">Protótipo interativo</p><p class="toolbar-title">Escolha uma direção visual</p></div>
    </div>
    <div class="design-selector" role="group" aria-label="Selecionar design do site">
      <button class="design-option is-active" type="button" data-design="editorial" aria-pressed="true"><span class="option-number">01</span><span>Editorial</span></button>
      <button class="design-option" type="button" data-design="menu" aria-pressed="false"><span class="option-number">02</span><span>Menu da casa</span></button>
      <button class="design-option" type="button" data-design="catalog" aria-pressed="false"><span class="option-number">03</span><span>Catálogo</span></button>
    </div>
    <p class="selection-status" id="design-status" aria-live="polite">Design selecionado: Editorial</p>
  </header>
  <div id="site-content"></div>
  <noscript><p class="no-script">Ative o JavaScript para alternar entre as três versões do protótipo.</p></noscript>
</body>
</html>
